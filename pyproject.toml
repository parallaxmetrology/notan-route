[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "notan-route"
version = "0.1.0"
description = "The order in which a picture's Notan masses lead from one to the next, and the transition field behind it. Deterministic, no learned model."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Russell Parrish" }]
requires-python = ">=3.9"
dependencies = [
  "parallax-notan @ git+https://github.com/parallaxmetrology/notan@2536f38",
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-image>=0.19",
  "Pillow>=9",
]
keywords = ["notan", "composition", "painting", "image analysis", "value structure"]

[project.urls]
Homepage = "https://www.parallaxmetrology.com"
Source = "https://github.com/parallaxmetrology/notan-route"
Notan = "https://github.com/parallaxmetrology/notan"
Essay = "https://www.parallaxmetrology.com/how_measures_lie.html"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff==0.6.9"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["notan_route"]

[project.scripts]
notan-route = "notan_route.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skimage"]
